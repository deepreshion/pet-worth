project_id = "pet-worth"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "petworth://auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Match the hosted project's current Email OTP length and expiry.
otp_length = 6
otp_expiry = 3600
max_frequency = "1m"

[auth.email.template.magic_link]
subject = "Pet Worth — код для входа / sign-in code"
content_path = "./supabase/templates/email-otp.html"

[auth.email.template.confirmation]
subject = "Pet Worth — код для входа / sign-in code"
content_path = "./supabase/templates/email-otp.html"

[storage]
enabled = true
file_size_limit = "20MiB"
